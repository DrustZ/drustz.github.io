<span class="sr-only" data-i18n="Navigation:">Navigation:</span>
<ul>
  {% assign pages = site.pages %}

  {% for document in site.documents %}
    {% assign pages = pages | push: document %}
  {% endfor %}

  {% assign pages = pages | where: "menu", true | sort: "order" %}

  {% for node in pages %}
    <li>
      <a class="sidebar-nav-item{% if page.url == node.url %} active{% endif %}" href="{{ node.url | relative_url }}" data-i18n="{{ node.title }}">{{ node.title }}</a>
    </li>
  {% endfor %}
  <!-- link -->
  <li>
    <a class="sidebar-nav-item" href="http://drustz.com/assets/pdfs/CV-research.pdf" data-i18n="CV">CV</a>
  </li>
</ul>
